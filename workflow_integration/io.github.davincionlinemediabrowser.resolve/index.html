<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Media Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: #121721;
      --line: #263247;
      --text: #edf4ff;
      --muted: #98a6ba;
      --cyan: #51d6ff;
      --red: #ff6874;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, calc(100vw - 48px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .pulse {
      width: 36px;
      height: 3px;
      margin-top: 16px;
      border-radius: 999px;
      background: var(--cyan);
      animation: pulse 1s ease-in-out infinite alternate;
    }

    .error {
      color: var(--red);
    }

    @keyframes pulse {
      from {
        opacity: 0.35;
        transform: scaleX(0.6);
      }
      to {
        opacity: 1;
        transform: scaleX(1.35);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Online Media Browser</h1>
    <p id="status">Starting local media service...</p>
    <div class="pulse" aria-hidden="true"></div>
  </main>
</body>
</html>
